<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14284b">
<title>フォワーダーCS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one column app. Title -> office hours (one inquiry at a time) -> rush (inbox piles up, real-time) -> result with review. Single player; best score in localStorage only. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --sunk: #e2e7ee; --ink: #172238; --muted: #5b6780; --line: #cfd6e2;
  --navy: #14284b; --navy-ink: #ffffff; --accent: #d9631e; --accent-ink: #ffffff; --accent-soft: #fbe6d8;
  --good: #23784a; --good-bg: #dcf0e3; --bad: #b8372b; --bad-bg: #f8dfdb; --mid: #806212; --mid-bg: #f4ebcf;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1424; --surface: #162036; --sunk: #0a101d; --ink: #e3e9f4; --muted: #95a2bb; --line: #2a3754;
    --navy: #0a1222; --navy-ink: #e3e9f4; --accent: #f08a4b; --accent-ink: #1d0c02; --accent-soft: #3a2416;
    --good: #7fd6a0; --good-bg: #173322; --bad: #f2907f; --bad-bg: #3a1d19; --mid: #e6c66e; --mid-bg: #352c13;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 640px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { font-size: 17px; padding: 14px 20px; width: 100%; }
.muted { color: var(--muted); }
.credit { margin: 0; font-size: 12px; color: var(--muted); text-align: center; letter-spacing: .05em; }

/* Title */
.title { flex: 1; display: flex; flex-direction: column; gap: 20px; padding-top: 28px; }
.hero { background: var(--navy); color: var(--navy-ink); border-radius: 16px; padding: 24px 20px 20px; position: relative; overflow: hidden; }
.hero .tag { font-size: 12px; letter-spacing: .2em; opacity: .75; font-weight: 700; }
.hero h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 10vw, 48px); line-height: 1.15; margin: 6px 0 4px; }
.hero h1 span { color: var(--accent); }
.hero p { margin: 0; opacity: .85; font-size: 14px; }
.hero svg { position: absolute; right: -14px; bottom: -10px; width: 130px; opacity: .16; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.panel h2 { font-size: 16px; margin: 0 0 6px; }
.panel ol, .panel ul { margin: 0; padding-left: 1.3em; font-size: 14px; color: var(--muted); }
.panel li + li { margin-top: 4px; }
.best { font-size: 14px; color: var(--muted); text-align: center; margin: 0; }

/* HUD */
.hud { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 8px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; border-bottom: 1px solid var(--line); }
.clock { font-family: var(--font-display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; grid-row: span 2; }
.clock small { display: block; font-family: var(--font-body); font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .1em; margin-top: 4px; }
.meter { display: grid; grid-template-columns: 5.6em 1fr 2em; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.meter .bar { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .5s; }
.meter.trust .bar i { background: #3f6fc4; }
.meter b { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }

/* Mail card */
.stage { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; }
.count { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .08em; }
.mail { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.mail .head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.mail .ico { width: 36px; height: 36px; border-radius: 50%; background: var(--navy); color: var(--navy-ink); display: grid; place-items: center; font-size: 18px; flex: none; }
.mail .ico.phone { background: var(--accent); }
.mail .from { font-size: 13px; color: var(--muted); }
.mail .subj { font-weight: 700; font-size: 16px; line-height: 1.4; }
.mail .follow { display: inline-block; font-size: 11px; font-weight: 700; color: var(--bad); background: var(--bad-bg); border-radius: 4px; padding: 0 6px; margin-bottom: 2px; }
.mail .body { padding: 14px 16px; margin: 0; white-space: pre-wrap; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; line-height: 1.55; display: flex; gap: 10px; }
.choice:hover { border-color: var(--accent); }
.choice .k { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.reply { background: var(--accent-soft); border-radius: 14px 14px 14px 4px; padding: 12px 14px; }
.reply .who { font-size: 12px; color: var(--muted); font-weight: 700; }
.reply p { margin: 2px 0 0; }
.you { align-self: flex-end; max-width: 90%; background: var(--navy); color: var(--navy-ink); border-radius: 14px 14px 4px 14px; padding: 10px 14px; font-size: 14px; }
.deltas { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: var(--sunk); }
.chip.up { background: var(--good-bg); color: var(--good); }
.chip.down { background: var(--bad-bg); color: var(--bad); }
.toast { text-align: center; font-size: 13px; color: var(--muted); }

/* Interstitial */
.inter { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; text-align: center; padding: 40px 0; }
.inter h2 { font-family: var(--font-display); font-weight: 400; font-size: 34px; margin: 0; color: var(--accent); }
.inter p { margin: 0; }

/* Rush */
.rushbar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; margin-top: 2px; grid-column: 1 / -1; }
.rushbar i { display: block; height: 100%; background: var(--accent); }
.inbox { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; }
.inbox .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 14px; }
.item { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px 12px; position: relative; overflow: hidden; }
.item.new { animation: pop .25s ease-out; }
.item.urgent { border-color: var(--bad); }
.item .top { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); font-weight: 700; }
.item .u { color: var(--bad); background: var(--bad-bg); border-radius: 4px; padding: 0 6px; }
.item .q { font-weight: 700; margin-top: 2px; line-height: 1.5; }
.item .ttl { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--accent); }
.item.urgent .ttl { background: var(--bad); }
.item .ans { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.item .ans button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 1.5; }
.item .ans button:hover { border-color: var(--accent); }
@keyframes pop { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
.flash { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: 28px; pointer-events: none; animation: flash .7s ease-out forwards; z-index: 20; text-shadow: 0 2px 8px rgba(0,0,0,.2); }
.flash.ok { color: var(--good); } .flash.ng { color: var(--bad); }
@keyframes flash { from { opacity: 1; transform: translate(-50%, -50%) scale(.8); } to { opacity: 0; transform: translate(-50%, -90%) scale(1.1); } }

/* Result */
.result { display: flex; flex-direction: column; gap: 16px; padding-top: 24px; }
.rank { background: var(--navy); color: var(--navy-ink); border-radius: 16px; padding: 22px 20px; text-align: center; }
.rank .lab { font-size: 12px; letter-spacing: .2em; opacity: .75; font-weight: 700; }
.rank h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 9vw, 42px); margin: 4px 0; color: var(--accent); line-height: 1.2; }
.rank .score { font-size: 15px; }
.rank .new { display: inline-block; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; border-radius: 999px; padding: 0 10px; margin-left: 6px; }
.rank .comment { margin: 8px 0 0; font-size: 14px; opacity: .85; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 700; }
.review h3 { font-size: 16px; margin: 6px 0 8px; }
.rv { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
.rv summary { padding: 10px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; list-style: none; }
.rv summary::-webkit-details-marker { display: none; }
.rv .g { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; }
.rv .g2 { background: var(--good-bg); color: var(--good); } .rv .g1 { background: var(--mid-bg); color: var(--mid); } .rv .g0 { background: var(--bad-bg); color: var(--bad); } .rv .gx { background: var(--sunk); color: var(--muted); }
.rv .s { font-weight: 700; line-height: 1.4; }
.rv .in { padding: 0 14px 12px; font-size: 14px; }
.rv .in p { margin: 6px 0 0; }
.rv .in .lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
.rv .in .best { text-align: left; color: var(--good); font-size: 14px; }
.rv .in .why { color: var(--bad); }
.actions { display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="cases.js"></script>
<script>
"use strict";
const $app = document.getElementById("app");
const START = 9 * 60, RUSH_AT = 16 * 60, END = 18 * 60;
const MAIN_COUNT = 9, SCALE = 0.6;
const store = {
  get(k, d) { try { const v = localStorage.getItem("fcs:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("fcs:" + k, JSON.stringify(v)); } catch {} }
};
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = v => Math.max(0, Math.min(100, v));
const fmt = m => `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, "0")}`;
const GMARK = ["×", "○", "◎"];

let G = null;

/* ---------- Title ---------- */
function showTitle() {
  stopRush();
  const best = store.get("best", null);
  $app.replaceChildren(h("div", { class: "title" },
    h("div", { class: "hero" },
      h("div", { class: "tag" }, "国際物流カスタマーサービス"),
      h("h1", {}, "フォワーダー", h("span", {}, "CS")),
      h("p", {}, "本日の問い合わせ、さばけますか？"),
      shipSvg()),
    h("div", { class: "panel" },
      h("h2", {}, "遊び方"),
      h("ol", {},
        h("li", {}, "9:00 始業。荷主さんからメールや電話が1件ずつ届きます。"),
        h("li", {}, "返答や行動を選ぶと「顧客満足度」「社内の信頼」が変わり、時間が進みます。その場しのぎの返事は、あとで跳ね返ってくることも……。"),
        h("li", {}, "16:00 からはラッシュタイム。次々届く問い合わせを、制限時間内に正しく片付けましょう。急ぎ（赤）は早く消えます。"),
        h("li", {}, "18:00 終業。残った問い合わせは残業になります。評価と解説が出ます。"))),
    h("button", { class: "btn primary big", onclick: startGame }, "出勤する"),
    best ? h("p", { class: "best" }, `自己ベスト：${best.score}点（${best.rank}）`) : null,
    h("p", { class: "credit" }, "開発：tenwalker")));
}
function shipSvg() {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 160 80");
  svg.innerHTML = '<g fill="currentColor"><path d="M8 52h144l-14 22H24z"/><rect x="30" y="34" width="22" height="16"/><rect x="54" y="34" width="22" height="16"/><rect x="78" y="34" width="22" height="16"/><rect x="42" y="18" width="22" height="14"/><rect x="66" y="18" width="22" height="14"/><rect x="112" y="16" width="16" height="34"/><rect x="116" y="6" width="6" height="10"/></g>';
  return svg;
}

/* ---------- Office hours ---------- */
function startGame() {
  const pool = shuffle(window.FCS_CASES).slice(0, MAIN_COUNT);
  G = { clock: START, sat: 50, trust: 50, overtime: 0, queue: pool.map(c => ({ ...c, follow: false })),
        done: [], idx: 0, pendingFollow: [], rush: { ok: 0, ng: 0, miss: 0, left: 0 }, missedMain: [], laterClaims: [] };
  nextCase();
}
function hud(extra) {
  return h("div", { class: "hud" },
    h("div", { class: "clock", id: "clock" }, fmt(G.clock), h("small", {}, G.clock >= RUSH_AT ? "ラッシュ" : "勤務中")),
    meter("満足度", G.sat, "sat"), meter("社内の信頼", G.trust, "trust"), extra || null);
}
function meter(label, v, cls) {
  return h("div", { class: "meter " + cls }, h("span", {}, label), h("div", { class: "bar" }, h("i", { style: `width:${v}%` })), h("b", {}, Math.round(v)));
}
function nextCase() {
  if (G.clock >= RUSH_AT || G.idx >= G.queue.length) return endOffice();
  const c = G.queue[G.idx];
  const opts = shuffle(c.c);
  $app.replaceChildren(hud(), h("div", { class: "stage" },
    h("div", { class: "count" }, `${G.idx + 1}件目`),
    mailCard(c),
    h("div", { class: "choices" }, opts.map((o, i) =>
      h("button", { class: "choice", onclick: () => choose(c, o) }, h("span", { class: "k" }, i + 1), h("span", {}, o.x))))));
  window.scrollTo(0, 0);
}
function mailCard(c) {
  const phone = c.via === "phone";
  return h("div", { class: "mail" },
    h("div", { class: "head" },
      h("div", { class: "ico" + (phone ? " phone" : "") }, phone ? "☎" : "✉"),
      h("div", {}, c.follow ? h("div", { class: "follow" }, "跳ね返り") : null,
        h("div", { class: "subj" }, c.subj), h("div", { class: "from" }, c.from))),
    h("p", { class: "body" }, c.body));
}
function choose(c, o) {
  const ds = Math.round(o.s * SCALE), dr = Math.round(o.r * SCALE);
  G.sat = clamp(G.sat + ds); G.trust = clamp(G.trust + dr);
  G.clock += o.t;
  G.done.push({ c, o });
  if (o.next && window.FCS_FOLLOW[o.next]) {
    const f = { ...window.FCS_FOLLOW[o.next], id: o.next, follow: true };
    G.queue.splice(Math.min(G.idx + 3, G.queue.length), 0, f);
  }
  G.idx++;
  const chips = [chip("満足度", ds), chip("信頼", dr), h("span", { class: "chip" }, `⏱ ${o.t}分`)];
  $app.replaceChildren(hud(), h("div", { class: "stage" },
    mailCard(c),
    h("div", { class: "you" }, o.x),
    h("div", { class: "reply" }, h("div", { class: "who" }, c.from), h("p", {}, o.res)),
    h("div", { class: "deltas" }, chips),
    h("button", { class: "btn primary big", onclick: nextCase },
      G.clock >= RUSH_AT || G.idx >= G.queue.length ? "16:00 へ" : "次の問い合わせへ")));
  window.scrollTo(0, 0);
}
function chip(label, d) {
  return h("span", { class: "chip " + (d > 0 ? "up" : d < 0 ? "down" : "") }, `${label} ${d > 0 ? "+" : ""}${d}`);
}
function endOffice() {
  // 時間切れで手を付けられなかった問い合わせ
  const left = G.queue.slice(G.idx);
  for (const c of left) {
    if (c.follow) { G.laterClaims.push(c); G.sat = clamp(G.sat - 5); }
    else { G.missedMain.push(c); G.sat = clamp(G.sat - 4); }
  }
  const lines = [];
  if (G.clock < RUSH_AT) { lines.push(`${fmt(G.clock)}、ひと通り片付きました。少し書類整理をして……`); G.clock = RUSH_AT; }
  else if (G.clock > RUSH_AT) lines.push(`気づけば ${fmt(G.clock)}。予定より押しています。`);
  if (G.missedMain.length) lines.push(`手を付けられなかった問い合わせが ${G.missedMain.length}件 あります。`);
  $app.replaceChildren(h("div", { class: "inter" },
    h("h2", {}, "ラッシュタイム"),
    ...lines.map(t => h("p", { class: "muted" }, t)),
    h("p", {}, "夕方は問い合わせが一気に来ます。カードをタップして対応を選んでください。赤い「急ぎ」は早く消えます。"),
    h("button", { class: "btn primary big", onclick: startRush }, "受けて立つ")));
  window.scrollTo(0, 0);
}

/* ---------- Rush ---------- */
let R = null;
function startRush() {
  if (G.clock >= END) return showResult();
  R = { items: [], pool: shuffle(window.FCS_RUSH), pi: 0, open: null, last: performance.now(), spawnIn: 1.2, raf: 0, nid: 0, paused: false };
  renderRush();
  R.raf = requestAnimationFrame(tick);
}
function stopRush() { if (R) cancelAnimationFrame(R.raf); R = null; }
document.addEventListener("visibilitychange", () => { if (R) { R.paused = document.hidden; R.last = performance.now(); } });
function spawn() {
  if (R.pi >= R.pool.length) { R.pool = shuffle(window.FCS_RUSH); R.pi = 0; }
  const d = R.pool[R.pi++];
  const ttl = d.urgent ? 16 : 30;
  R.items.unshift({ id: ++R.nid, d, ttl, left: ttl, order: shuffle([0, 1]) });
}
function tick(now) {
  if (!R) return;
  const dt = Math.min(0.25, (now - R.last) / 1000); R.last = now;
  if (!R.paused) {
    G.clock = Math.min(END, G.clock + dt); // 1秒 = 1分
    R.spawnIn -= dt;
    if (R.spawnIn <= 0) {
      spawn();
      const p = (G.clock - RUSH_AT) / (END - RUSH_AT);
      R.spawnIn = 5.2 - 2 * Math.max(0, p) + Math.random() * 1.2;
    }
    for (const it of R.items) it.left -= dt;
    const expired = R.items.filter(it => it.left <= 0);
    if (expired.length) {
      for (const it of expired) {
        G.rush.miss++;
        G.sat = clamp(G.sat - (it.d.urgent ? 6 : 3));
        if (it.d.urgent) G.trust = clamp(G.trust - 2);
        if (R.open === it.id) R.open = null;
      }
      R.items = R.items.filter(it => it.left > 0);
      flash("見逃し", "ng");
    }
    if (G.clock >= END) { finishRush(); return; }
  }
  updateRush();
  R.raf = requestAnimationFrame(tick);
}
function renderRush() {
  const total = END - RUSH_AT;
  $app.replaceChildren(
    hud(h("div", { class: "rushbar" }, h("i", { id: "rb", style: `width:${(G.clock - RUSH_AT) / total * 100}%` }))),
    h("div", { class: "inbox", id: "inbox" },
      R.items.length ? R.items.map(itemEl) : h("div", { class: "empty" }, "受信箱は空です。次の問い合わせを待っています……")));
}
function itemEl(it) {
  const open = R.open === it.id;
  const fresh = !it.seen; it.seen = true;
  return h("div", { class: "item" + (it.d.urgent ? " urgent" : "") + (fresh ? " new" : ""), "data-id": it.id, role: open ? null : "button", tabindex: open ? null : 0,
      onclick: open ? null : () => { R.open = it.id; renderRush(); },
      onkeydown: open ? null : e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); R.open = it.id; renderRush(); } } },
    h("div", { class: "top" }, it.d.urgent ? h("span", { class: "u" }, "急ぎ") : null, h("span", {}, it.d.from)),
    h("div", { class: "q" }, it.d.q),
    open ? h("div", { class: "ans" }, it.order.map(k => h("button", { onclick: e => { e.stopPropagation(); answer(it, k); } }, it.d.a[k]))) : null,
    h("div", { class: "ttl", style: `width:${it.left / it.ttl * 100}%` }));
}
function updateRush() {
  const ck = document.getElementById("clock");
  if (!ck) return;
  // 件数が変わったら描き直し、そうでなければバーと時計だけ更新
  const ids = R.items.map(it => it.id).join(",");
  if (ids !== R.shown) { R.shown = ids; renderRush(); return; }
  ck.firstChild.nodeValue = fmt(Math.floor(G.clock));
  const rb = document.getElementById("rb");
  if (rb) rb.style.width = `${(G.clock - RUSH_AT) / (END - RUSH_AT) * 100}%`;
  for (const it of R.items) {
    const el = document.querySelector(`.item[data-id="${it.id}"] .ttl`);
    if (el) el.style.width = `${Math.max(0, it.left / it.ttl * 100)}%`;
  }
}
function answer(it, k) {
  const ok = k === it.d.ok;
  if (ok) { G.rush.ok++; G.sat = clamp(G.sat + (it.d.urgent ? 3 : 2)); G.trust = clamp(G.trust + 2); flash("OK!", "ok"); }
  else { G.rush.ng++; G.sat = clamp(G.sat - 4); G.trust = clamp(G.trust - 4); flash("NG…", "ng"); }
  R.items = R.items.filter(x => x.id !== it.id);
  R.open = null; R.shown = null;
  renderRush();
}
function flash(t, cls) {
  const el = h("div", { class: "flash " + cls }, t);
  document.body.append(el);
  setTimeout(() => el.remove(), 750);
}
function finishRush() {
  G.rush.left = R.items.length;
  G.overtime = G.rush.left * 10;
  stopRush();
  showResult();
}

/* ---------- Result ---------- */
const RANKS = [
  [88, "伝説のCS", "荷主から指名で電話が来るレベル。船社の担当者もあなたには頭が上がりません。"],
  [74, "頼れるエース", "安心して任せられる対応でした。後輩に教える側です。"],
  [60, "一人前のCS", "大きな事故なく1日を乗り切りました。あと一歩の気配りでエースです。"],
  [45, "見習いCS", "その場しのぎの返事がいくつか……。解説を読んで明日に備えましょう。"],
  [0, "新人（明日もがんばろう）", "今日は荒れました。まずは「確認してから答える」を合言葉に。"]
];
function showResult() {
  stopRush();
  const score = Math.max(0, Math.round((G.sat + G.trust) / 2 - G.overtime / 6));
  const [, rank, comment] = RANKS.find(r => score >= r[0]);
  const best = store.get("best", null);
  const isNew = !best || score > best.score;
  if (isNew) store.set("best", { score, rank });
  const items = G.done.map(({ c, o }) => {
    const top = c.c.reduce((a, b) => (b.g > a.g ? b : a));
    return h("details", { class: "rv" },
      h("summary", {}, h("span", { class: "g g" + o.g }, GMARK[o.g]), h("span", { class: "s" }, c.follow ? "【跳ね返り】" : "", c.subj)),
      h("div", { class: "in" },
        h("p", {}, h("span", { class: "lbl" }, "あなたの対応："), o.x),
        o.w ? h("p", { class: "why" }, h("span", { class: "lbl" }, "ここが惜しい："), o.w) : null,
        o.g < 2 ? h("p", { class: "best" }, h("span", { class: "lbl" }, "おすすめ："), top.x) : null,
        h("p", {}, c.e)));
  });
  const missed = [...G.missedMain, ...G.laterClaims].map(c =>
    h("details", { class: "rv" },
      h("summary", {}, h("span", { class: "g gx" }, "－"), h("span", { class: "s" }, c.follow ? "【翌日に届いたクレーム】" : "【未対応】", c.subj)),
      h("div", { class: "in" }, h("p", {}, c.e))));
  $app.replaceChildren(h("div", { class: "result" },
    h("div", { class: "rank" },
      h("div", { class: "lab" }, "本日の評価"),
      h("h2", {}, rank),
      h("div", { class: "score" }, `${score}点`, isNew ? h("span", { class: "new" }, "自己ベスト") : null),
      h("p", { class: "comment" }, comment)),
    h("div", { class: "stats" },
      stat(Math.round(G.sat), "顧客満足度"), stat(Math.round(G.trust), "社内の信頼"), stat(G.overtime + "分", "残業"),
      stat(G.rush.ok, "ラッシュ正解"), stat(G.rush.ng, "ラッシュ誤答"), stat(G.rush.miss, "見逃し")),
    h("div", { class: "review" }, h("h3", {}, "今日の問い合わせ（タップで解説）"), items, missed),
    h("div", { class: "actions" },
      h("button", { class: "btn primary big", onclick: startGame }, "もう一日働く"),
      h("button", { class: "btn big", onclick: showTitle }, "タイトルへ")),
    h("p", { class: "credit" }, "開発：tenwalker")));
  window.scrollTo(0, 0);
}
function stat(v, label) { return h("div", { class: "stat" }, h("b", {}, v), h("span", {}, label)); }

showTitle();
</script>
</body>
